[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stoodx"
version = "0.1.0"
description = "Explainable out-of-distribution detection by nonparametric statistical testing"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Iván Sevillano-García", email = "isevillano@go.ugr.es" }]
keywords = ["xai", "out-of-distribution", "explainability", "statistical-testing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "zennit-crp>=0.6",
    "baycomp>=1.0",
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/isega24/STOOD-X"
Paper = "https://doi.org/10.1016/j.patcog.2026.113254"

[tool.setuptools.packages.find]
include = ["stoodx*"]
